<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>J49 emulator</title>
<style>
:root{--bg:#12151b;--panel:#1a1e27;--line:#2a3040;--dim:#7d869a;--text:#d6dae3;--accent:#f0b429}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;gap:20px;padding:24px 16px}
h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0;font-weight:600}
/* the thermostat: a steel ring around black glass, the 320 px screen in the middle */
#nest{width:min(516px,92vw);aspect-ratio:1;border-radius:50%;padding:2.8%;cursor:pointer;touch-action:none;
  background:conic-gradient(from 210deg,#8d949e,#e6e9ee,#9aa1ab,#5d636d,#c9cdd4,#8d949e);box-shadow:0 18px 50px rgba(0,0,0,.55)}
#glass{width:100%;height:100%;border-radius:50%;background:#000;display:grid;place-items:center}
canvas{width:66%;aspect-ratio:1;border-radius:50%;image-rendering:auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button,select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer}
button:focus-visible,select:focus-visible,#nest:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
p{margin:0;color:var(--dim);font-size:13px;text-align:center;max-width:520px}
</style>
</head>
<body>
<h1>J49 emulator</h1>
<div id="nest" tabindex="0" role="application" aria-label="The thermostat: wheel or arrow keys turn the ring, click or Enter presses it"><div id="glass"><canvas id="c" width="320" height="320"></canvas></div></div>
<div class="bar">
  <button id="left" aria-label="turn left">⟲</button>
  <button id="press">Press</button>
  <button id="right" aria-label="turn right">⟳</button>
  <select id="lang" aria-label="language"><option value="en">English</option><option value="nl">Nederlands</option></select>
  <select id="theme" aria-label="theme"><option value="default">Default</option><option value="home-assistant">Home Assistant</option><option value="home-assistant-light">Home Assistant Light</option><option value="light">Light</option></select>
</div>
<p>Mouse wheel or the arrow keys turn the ring; a click, Enter or the space bar presses it. The thermostat behind the screen is simulated: a room of 19.4 degrees and a heating that follows the target.</p>
<script>
"use strict";
const $ = id => document.getElementById(id), ctx = $("c").getContext("2d"), img = ctx.createImageData(320, 320);
const post = path => fetch(path, {method: "POST", headers: {"X-J49-Emu": "1"}}).catch(() => {});
async function frame() {
  try {
    const b = new Uint8Array(await (await fetch("/frame")).arrayBuffer());
    if (b.length === 409600) {
      const d = img.data;                       // the frame buffer is B G R A; the canvas wants R G B A
      for (let i = 0; i < 409600; i += 4) { d[i] = b[i + 2]; d[i + 1] = b[i + 1]; d[i + 2] = b[i]; d[i + 3] = 255; }
      ctx.putImageData(img, 0, 0);
    }
  } catch (e) { /* the emulator stopped: keep the last picture */ }
  setTimeout(frame, document.hidden ? 1000 : 80);
}
let wheel = 0;
$("nest").addEventListener("wheel", e => {
  e.preventDefault();
  wheel += e.deltaY;
  const n = Math.trunc(wheel / 50);            // about one step per notch, also on a touch pad
  if (n) { wheel -= n * 50; post("/turn?n=" + n); }
}, {passive: false});
$("nest").addEventListener("click", () => post("/click"));
$("nest").addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowUp") post("/turn?n=1");
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") post("/turn?n=-1");
  else if (e.key === "Enter" || e.key === " ") post("/click");
  else return;
  e.preventDefault();
});
$("left").onclick = () => post("/turn?n=-1"); $("right").onclick = () => post("/turn?n=1"); $("press").onclick = () => post("/click");
$("lang").onchange = $("theme").onchange = () => post("/look?lang=" + $("lang").value + "&theme=" + $("theme").value);
frame();
</script>
</body>
</html>
